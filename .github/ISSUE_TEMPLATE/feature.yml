name: Feature request
description: Suggest a feature or module
labels: ['type:feature', 'status:needs-triage']
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do and why is it hard today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: checkboxes
    id: fair
    attributes:
      label: Fair play
      options:
        - label: This feature gives no competitive advantage beyond what vanilla Minecraft shows.
          required: true
