# Rust workspace. The Tauri app (apps/launcher/src-tauri) joins as a member when it is created.
[workspace]
resolver = "3"
members = ["crates/launcher-core", "crates/manifest"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/gitzetazero/Veyra"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
