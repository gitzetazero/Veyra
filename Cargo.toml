# Rust workspace.
[workspace]
resolver = "3"
members = ["crates/launcher-core", "crates/manifest", "apps/launcher/src-tauri"]
# The desktop app needs its UI built first and system WebView libraries, so it builds in its own CI job.
default-members = ["crates/launcher-core", "crates/manifest"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/gitzetazero/Veyra"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
