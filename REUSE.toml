version = 1

# Default: GPL-3.0-only. More specific annotations below take precedence.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "VEYRA contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["client/api/**", "crates/manifest/**"]
precedence = "override"
SPDX-FileCopyrightText = "VEYRA contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "VEYRA contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["LICENSES/**", "LICENSE", "CODE_OF_CONDUCT.md", "Cargo.lock", "apps/launcher/pnpm-lock.yaml"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Gradle wrapper files are generated by Gradle (Apache-2.0).
[[annotations]]
path = ["client/gradlew", "client/gradlew.bat", "client/gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
