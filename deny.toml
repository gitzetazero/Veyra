# cargo-deny: licences, security advisories and dependency sources for the Rust workspace.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained (not vulnerable); it is a build-time macro pulled in by Tauri's GTK dependencies on Linux, with no upstream replacement yet." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
